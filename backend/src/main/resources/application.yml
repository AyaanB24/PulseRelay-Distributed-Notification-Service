spring:
  application:
    name: pulserelay
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:pulserelay_dev}
    username: ${DB_USER:pulserelay}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 10
          fetch_size: 50

server:
  port: 8084
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.pulserelay: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# PulseRelay-specific configuration
pulserelay:
  admin:
    # Admin secret for tenant registration endpoint
    # Required for POST /api/v1/admin/tenants
    # Set via environment variable: PULSERELAY_ADMIN_SECRET
    secret: ${PULSERELAY_ADMIN_SECRET:#{null}}
