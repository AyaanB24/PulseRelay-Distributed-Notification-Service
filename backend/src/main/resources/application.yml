spring:
  application:
    name: pulserelay

  # Disable default static resource handling to prevent API routes from being treated as static resources
  mvc:
    static-path-pattern: /static/**
    resources:
      add-mappings: false

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/pulserelay_dev
    username: postgres
    password: root123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none  # Flyway handles ALL database changes, Hibernate does nothing
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50

  # Flyway Configuration for Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    schemas: public
    outOfOrder: false
    validateOnMigrate: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092

    # Producer (Phase 05: OutboxPublisher)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all  # Wait for all replicas before returning (safe but slower)
      retries: 3
      properties:
        linger.ms: 10  # Batch messages every 10ms
        batch.size: 16384  # Batch size in bytes

    # Consumer (Phase 06: NotificationEventConsumer)
    consumer:
      bootstrap-servers: localhost:9092
      group-id: pulserelay-consumer-group
      auto-offset-reset: earliest  # Start from beginning if group is new
      enable-auto-commit: false  # Manual commit via acknowledgment
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pulserelay.*"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000

  # Logging
  logging:
    level:
      root: INFO
      com.pulserelay: DEBUG
      org.springframework.kafka: INFO
      org.hibernate.SQL: DEBUG

  # Mail Configuration for SMTP (Phase 09)
  mail:
    host: ${PULSERELAY_SMTP_HOST:localhost}
    port: ${PULSERELAY_SMTP_PORT:1025}
    username: ${PULSERELAY_SMTP_USERNAME:}
    password: ${PULSERELAY_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${PULSERELAY_SMTP_AUTH:false}
          starttls:
            enable: ${PULSERELAY_SMTP_STARTTLS:false}

# PulseRelay Application Configuration
pulserelay:
  # Admin secret for tenant management endpoints
  admin:
    secret: admin-secret-key-2026

  # Outbox Pattern Configuration (Phase 05)
  outbox:
    poll-interval: 5000  # Poll for eligible events every 5 seconds
    max-retries: 5  # Maximum retry attempts before marking TERMINAL_FAILED
    initial-backoff-ms: 1000  # Initial backoff: 1s (doubles with each retry)
    # Backoff schedule:
    # - Attempt 1: 1s
    # - Attempt 2: 2s
    # - Attempt 3: 4s
    # - Attempt 4: 8s
    # - Attempt 5: 16s

  # Kafka Topics
  kafka:
    topic:
      notifications: notification-events

  # Provider Configuration (Phase 09)
  provider:
    email:
      type: mock  # Options: mock, smtp (use smtp for real email delivery)

  # Retry Policy Configuration (Phase 10)
  retry:
    policy:
      max-attempts: 5  # Maximum retry attempts (including initial)
      initial-delay-ms: 1000  # Initial delay: 1 second
      max-delay-ms: 60000  # Max delay: 60 seconds
      backoff-multiplier: 2.0  # Exponential backoff multiplier

# Server Configuration
server:
  port: 8084
  servlet:
    context-path: /api
